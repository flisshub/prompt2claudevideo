function gdFacet(r, sides, round) {
  const sec = (Math.PI * 2) / sides;

    const m = ((a % sec) + sec) % sec;

    d += (i ? 'L' : 'M') + (rr * Math.cos(a)).toFixed(1) + ' ' + (rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}

function gdLotus(R) {
